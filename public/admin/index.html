<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Gabrinell 96</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="a-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
      <symbol id="a-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
      <symbol id="a-text" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h14"/></symbol>
      <symbol id="a-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></symbol>
      <symbol id="a-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></symbol>
      <symbol id="a-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.2 8 8 9 4.8-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="a-log" viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 8h6M9 12h6M9 16h4"/></symbol>
      <symbol id="a-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3M14 9l2 2"/></symbol>
      <symbol id="a-out" viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 8l4 4-4 4M20 12H9"/></symbol>
      <symbol id="a-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="a-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
      <symbol id="a-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    </defs>
  </svg>

  <!-- Login -->
  <section id="login-view" class="login" hidden>
    <div class="login__bg"></div>
    <form id="login-form" class="login__card" autocomplete="on" novalidate>
      <img src="/assets/img/logo.png" alt="Gabrinell 96 Unipessoal, Lda" class="login__logo">
      <h1>Admin sign in</h1>
      <p class="muted">Content management for gabrinell96 website</p>
      <label class="lf"><span>E-mail</span><input id="login-email" type="email" name="email" autocomplete="username" required autofocus></label>
      <label class="lf"><span>Password</span><input id="login-password" type="password" name="password" autocomplete="current-password" required></label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="btn btn--primary btn--block" id="login-btn" type="submit">Sign in</button>
      <a class="login__back" href="/">← Back to website</a>
    </form>
  </section>

  <!-- App shell -->
  <div id="app" class="app" hidden>
    <aside class="side" id="side">
      <a class="side__brand" href="#/dashboard"><img src="/assets/img/mark.png" alt=""><span><b>Gabrinell 96</b><small>Admin</small></span></a>
      <nav class="side__nav" id="side-nav" aria-label="Admin"></nav>
      <div class="side__foot">
        <a class="side__link" href="/" target="_blank" rel="noopener"><svg class="ico"><use href="#a-ext"/></svg><span>View website</span></a>
        <button class="side__link" id="btn-logout" type="button"><svg class="ico"><use href="#a-out"/></svg><span>Sign out</span></button>
      </div>
    </aside>
    <div class="side-scrim" id="side-scrim"></div>

    <div class="main">
      <header class="top">
        <button class="icon-btn top__burger" id="burger" type="button" aria-label="Menu"><svg class="ico"><use href="#a-menu"/></svg></button>
        <h1 id="page-title">Dashboard</h1>
        <div class="top__user" id="top-user"></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
